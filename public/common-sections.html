<!DOCTYPE html>
<!--
  common-sections.html — Site Studio Snippet Library
  ─────────────────────────────────────────────────────────────────────────
  Sources:
    • Open Pro (Cruip) sections — extracted from templates/open-pro-html/
    • Generic travel-agency sections — pure Tailwind, template-agnostic

  To add more sections automatically:
    node scripts/extract-sections.mjs >> public/common-sections.html

  Attributes on <template>:
    id              — unique key  (section-{type})
    data-type       — slug stored in site_config.custom_sections[].type
    data-label      — human label shown in the snippet panel
    data-icon       — emoji icon for the snippet card
    data-desc       — short description
    data-thumbnail  — preview image URL (Unsplash w=480&q=60)
    data-category   — Odoo-style group:
                        essential  — Hero, Intro, Features
                        commerce   — Tours, Pricing, Booking
                        trust      — Testimonials, Partners, FAQ
                        contact    — Contact Forms, Footer
-->

        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "weog9ymwey");
  </script>
</head>

  data-type="op-hero"
  data-category="essential"

  data-icon="🌄"
  data-desc="Full-width hero with headline, video modal and dual CTAs."

                                                    <linearGradient

                                                        x2="10"
                                                        y1="0"
                                                        y2="20"

                                                        <stop offset="1" stop-color="#6366F1" stop-opacity=".72" />

                                    x-transition:enter-start="opacity-0"
                                    x-transition:enter-end="opacity-100"
                                    x-transition:leave="transition ease-out duration-100"
                                    x-transition:leave-start="opacity-100"
                                    x-transition:leave-end="opacity-0"
                                    aria-hidden="true"
                                    x-cloak
                                ></div>
                                <!-- End: Modal backdrop -->

                                <!-- Modal dialog -->
                                <div
                                    id="modal"
                                    class="fixed inset-0 z-99999 flex px-4 py-6 sm:px-6"
                                    role="dialog"
                                    aria-modal="true"
                                    x-show="modalOpen"
                                    x-transition:enter="transition ease-out duration-300"
                                    x-transition:enter-start="opacity-0 scale-75"
                                    x-transition:enter-end="opacity-100translate-y-0"
                                    x-transition:leave="transition ease-out duration-200"
                                    x-transition:leave-start="opacity-100translate-y-0"
                                    x-transition:leave-end="opacity-0 scale-75"
                                    x-cloak
                                >

                                            class="aspect-video max-h-full w-full overflow-hidden rounded-2xl bg-black shadow-2xl"
                                            @click.outside="modalOpen = false"
                                            @keydown.escape.window="modalOpen = false"
                                        >
                                            <video
                                                x-init="$watch('modalOpen', value => value ? $el.play() : $el.pause())"
                                                width="1920"
                                                height="1080"
                                                loop
                                                controls
                                            >
                                                <source src="/api/tenant/template-assets/open-pro-html/videos/video.mp4" type="video/mp4" />
                                                Your browser does not support the video tag.
                                            </video>
                                        </div>
                                    </div>
                                </div>
                                <!-- End: Modal dialog -->

                                <script>
                                    document.addEventListener('alpine:init', () => {
                                        Alpine.data('handleVideoModal', () => ({
                                            modalOpen: false,
                                            scrollbarWidth: 0,
                                            init() {
                                                this.setScrollbarWidth()
                                                this.$watch('modalOpen', (value) => {
                                                    if (value) {
                                                        if (window.innerWidth > document.documentElement.clientWidth) {
                                                            document.documentElement.style.paddingRight = `${this.scrollbarWidth}px`
                                                        }
                                                        document.documentElement.style.overflow = 'hidden'
                                                    } else {
                                                        document.documentElement.style.overflow = ''
                                                        document.documentElement.style.paddingRight = ''
                                                    }
                                                })
                                            },
                                            setScrollbarWidth() {
                                                const scrollDiv = document.createElement('div')
                                                scrollDiv.style.cssText =
                                                    'width:100px;height:100px;overflow:scroll;position:absolute;top:-9999px;'
                                                document.body.appendChild(scrollDiv)
                                                this.scrollbarWidth = scrollDiv.offsetWidth - scrollDiv.clientWidth
                                                document.body.removeChild(scrollDiv)
                                            },
                                        }))
                                    })
                                </script>
                            </div>
                        </div>
                    </div>
