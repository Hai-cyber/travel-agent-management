<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Tours — TravelAgent</title>
  <style>
    :root {
      --bg-deep: #0f172a;
      --bg-blue: #1d4ed8;
      --accent: #2563eb;
      --ink: #0f172a;
      --muted: #64748b;
      --surface: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-blue) 100%);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }

    /* ── Topbar ─── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(16px);
      background: rgba(15, 23, 42, 0.48);
      border-bottom: 1px solid rgba(191, 219, 254, 0.18);
    }
    .topbar-inner {
      display: flex; justify-content: space-between; align-items: center;
      gap: 18px; padding: 14px 0;
    }
    .brand {
      display: flex; align-items: center; gap: 12px; color: #eff6ff;
    }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      color: #eff6ff; font: 800 14px/1 "Segoe UI", sans-serif;
    }
    .brand strong { font: 700 16px/1 Georgia, serif; letter-spacing: -0.01em; }

    /* ── Hero search ─── */
    .search-hero {
      padding: 48px 0 32px;
      text-align: center;
    }
    .search-hero h1 {
      margin: 0 0 8px;
      font: 700 clamp(26px, 5vw, 48px)/1.1 Georgia, serif;
      color: #eff6ff;
      letter-spacing: -0.02em;
    }
    .search-hero p { margin: 0 0 24px; color: rgba(219,234,254,0.72); font-size: 16px; }
    .search-bar {
      display: flex; gap: 8px;
      max-width: 600px; margin: 0 auto;
    }
    .search-bar input {
      flex: 1; padding: 14px 18px; font-size: 15px;
      border: none; border-radius: 999px;
      background: rgba(255,255,255,0.95);
      color: var(--ink); outline: none;
    }
    .search-bar input:focus {
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.45);
    }
    .search-bar button {
      padding: 14px 24px; font-size: 14px; font-weight: 700;
      border: none; border-radius: 999px; cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #eff6ff;
      transition: transform 150ms ease;
    }
    .search-bar button:hover { transform: translateY(-1px); }

    /* ── Results ─── */
    .results-wrap {
      background: var(--surface); border-radius: 22px 22px 0 0;
      padding: 32px; min-height: 60vh;
    }
    .results-meta {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .results-meta h2 { margin: 0; font-size: 18px; color: var(--ink); }
    .results-meta .hint { font-size: 13px; color: var(--muted); }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .tour-card {
      border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; background: #fff;
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .tour-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); transform: translateY(-2px); }
    .tour-type-badge {
      display: inline-block;
      padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
    }
    .badge-day    { background: #fef3c7; color: #92400e; }
    .badge-group  { background: #dbeafe; color: #1e40af; }
    .badge-custom { background: #f3e8ff; color: #6b21a8; }
    .tour-card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .tour-card .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .tour-card .tenant-tag {
      font-size: 11px; color: var(--accent); font-weight: 600;
    }
    .tour-card a.view-btn {
      display: inline-block; margin-top: 10px;
      padding: 8px 14px; font-size: 12px; font-weight: 700;
      border-radius: 999px; background: #eff6ff; color: var(--accent);
      border: 1px solid #bfdbfe; transition: background 150ms ease;
    }
    .tour-card a.view-btn:hover { background: #dbeafe; }

    /* ── States ─── */
    .state-msg {
      text-align: center; padding: 64px 16px; color: var(--muted); font-size: 15px;
    }
    .loading-spinner {
      display: inline-block; width: 24px; height: 24px; margin-bottom: 12px;
      border: 3px solid #e2e8f0; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pagination {
      display: flex; gap: 8px; justify-content: center;
      margin-top: 28px; flex-wrap: wrap;
    }
    .pagination button {
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--ink);
      transition: background 150ms;
    }
    .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pagination button:hover:not(.active) { background: #f1f5f9; }

    @media (max-width: 640px) {
      .search-hero { padding: 32px 0 20px; }
      .results-wrap { padding: 20px 16px; border-radius: 16px 16px 0 0; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/">
      <div class="brand-mark">TA</div>
      <strong>TravelAgent</strong>
    </a>
  </div>
</header>

<section class="search-hero">
  <div class="shell">
    <h1>Discover Tours</h1>
    <p>Search across all vetted travel operators on the platform.</p>
    <div class="search-bar">
      <input id="q-input" type="search" placeholder="Type a destination, tour name…" autocomplete="off" />
      <button id="btn-search">Search</button>
    </div>
  </div>
</section>

<div class="shell">
  <div class="results-wrap">
    <div id="results-root">
      <div class="state-msg">Enter a destination or tour name to start exploring.</div>
    </div>
  </div>
</div>

<script>
  const LIMIT = 18;
  let currentQuery = '';
  let currentPage  = 1;

  function badgeClass(tourType) {
    if (tourType === 'day_tour') return 'badge-day';
    if (tourType === 'custom_tour') return 'badge-custom';
    return 'badge-group';
  }

  function badgeLabel(tourType) {
    if (tourType === 'day_tour') return 'Day Tour';
    if (tourType === 'custom_tour') return 'Custom';
    return 'Group Tour';
  }

  function renderResults(data) {
    const root = document.getElementById('results-root');
    const { results, total, page, limit, query } = data;

    if (!results.length) {
      root.innerHTML = `<div class="state-msg">No tours found for "<strong>${escHtml(query)}</strong>".<br>Try another keyword.</div>`;
      return;
    }

    const totalPages = Math.ceil(total / limit);
    const cards = results.map((t) => `
      <div class="tour-card">
        <span class="tour-type-badge ${badgeClass(t.tour_type)}">${badgeLabel(t.tour_type)}</span>
        <h3>${escHtml(t.title)}</h3>
        ${t.duration_text ? `<div class="meta">⏱ ${escHtml(t.duration_text)}</div>` : ''}
        <div class="tenant-tag">🏢 ${escHtml(t.tenant_name)}</div>
        <a class="view-btn" href="${escHtml(t.tour_url)}" target="_blank" rel="noopener">View Tour →</a>
      </div>
    `).join('');

    const pagebtn = (p, label = String(p)) =>
      `<button class="${p === page ? 'active' : ''}" data-page="${p}">${escHtml(label)}</button>`;
    let pages = '';
    if (totalPages > 1) {
      if (page > 1) pages += pagebtn(page - 1, '← Prev');
      for (let p = Math.max(1, page - 2); p <= Math.min(totalPages, page + 2); p++) pages += pagebtn(p);
      if (page < totalPages) pages += pagebtn(page + 1, 'Next →');
    }

    root.innerHTML = `
      <div class="results-meta">
        <h2>${total} result${total !== 1 ? 's' : ''} for "<strong>${escHtml(query)}</strong>"</h2>
        <span class="hint">Page ${page} of ${totalPages}</span>
      </div>
      <div class="results-grid">${cards}</div>
      ${pages ? `<div class="pagination">${pages}</div>` : ''}
    `;

    root.querySelectorAll('.pagination button[data-page]').forEach((btn) => {
      btn.addEventListener('click', () => doSearch(currentQuery, parseInt(btn.dataset.page, 10)));
    });
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setLoading() {
    document.getElementById('results-root').innerHTML =
      `<div class="state-msg"><div class="loading-spinner"></div><br>Searching…</div>`;
  }

  async function doSearch(q, page = 1) {
    q = q.trim();
    if (!q || q.length < 2) return;
    currentQuery = q;
    currentPage  = page;

    // Sync URL
    const params = new URLSearchParams({ q });
    if (page > 1) params.set('page', page);
    history.replaceState({}, '', `/search.html?${params}`);

    setLoading();
    try {
      const url = `/api/universal/search?q=${encodeURIComponent(q)}&limit=${LIMIT}&page=${page}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data?.error || 'Search failed');
      renderResults(data);
    } catch (err) {
      document.getElementById('results-root').innerHTML =
        `<div class="state-msg">Search failed. Please try again.</div>`;
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  const qInput = document.getElementById('q-input');
  const btnSearch = document.getElementById('btn-search');

  btnSearch.addEventListener('click', () => doSearch(qInput.value));
  qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(qInput.value); });

  // Pre-fill from URL
  const initialQ = new URLSearchParams(location.search).get('q') || '';
  const initialPage = parseInt(new URLSearchParams(location.search).get('page') || '1', 10);
  if (initialQ) {
    qInput.value = initialQ;
    doSearch(initialQ, initialPage);
  }
</script>
</body>
</html>
