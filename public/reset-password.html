<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password - TravelAgent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1d4ed8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page-shell { width: 100%; max-width: 520px; }
    .card {
      background: rgba(255,255,255,.98);
      border-radius: 18px;
      padding: 40px;
      width: 100%;
      box-shadow: 0 30px 70px rgba(15,23,42,.32);
    }
    .logo { font-size: 28px; font-weight: 800; color: #2563eb; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 22px; }
    .hint-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .turnstile-shell {
      margin-top: 16px;
      display: none;
    }
    .turnstile-note {
      color: #475569;
      font-size: 12px;
      margin-bottom: 8px;
    }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; margin-top: 16px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #dbe4f0;
      border-radius: 10px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #2563eb; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover:not(:disabled) { background: #1d4ed8; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 14px; display: none; }
    .success-msg { color: #16a34a; font-size: 13px; margin-top: 14px; display: none; }
    .link-row { margin-top: 22px; text-align: center; font-size: 13px; color: #64748b; }
    .link-row a { color: #2563eb; text-decoration: none; font-weight: 700; }
    .dev-link {
      display: inline-block;
      margin-top: 8px;
      color: #1d4ed8;
      font-weight: 700;
      word-break: break-all;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: -3px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- MS Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "weog9ymwey");
  </script>
</head>
<body>
<div class="page-shell">
  <div class="card">
    <div class="logo">🧭 TravelAgent</div>
    <div class="subtitle" id="subtitle">Request a password reset link or set a new password.</div>

    <form id="request-form" novalidate>
      <label id="request-email-label" for="request-email">Email</label>
      <input id="request-email" type="email" placeholder="agency@example.com" required autocomplete="email" />
      <div class="turnstile-shell" id="turnstile-shell">
        <div class="turnstile-note" id="turnstile-note">Complete verification before requesting a reset link.</div>
        <div id="turnstile-container"></div>
      </div>
      <button class="btn" id="request-btn" type="submit">Send reset link</button>
      <div class="hint-box" id="dev-link-box"></div>
    </form>

    <form id="confirm-form" novalidate style="display:none">
      <div class="hint-box" id="token-hint"></div>
      <label id="new-password-label" for="new-password">New password</label>
      <input id="new-password" type="password" placeholder="Create a new password" required autocomplete="new-password" />

      <label id="confirm-password-label" for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" placeholder="Repeat your new password" required autocomplete="new-password" />

      <button class="btn" id="confirm-btn" type="submit">Update password</button>
    </form>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <div class="link-row"><a id="login-link" href="/login.html">Back to sign in</a></div>
  </div>
</div>

<script src="/auth-page-i18n.js"></script>
<script>
(async () => {
  const requestForm = document.getElementById('request-form');
  const confirmForm = document.getElementById('confirm-form');
  const requestBtn = document.getElementById('request-btn');
  const confirmBtn = document.getElementById('confirm-btn');
  const errorEl = document.getElementById('error-msg');
  const successEl = document.getElementById('success-msg');
  const devLinkBox = document.getElementById('dev-link-box');
  const tokenHint = document.getElementById('token-hint');
  const turnstileShell = document.getElementById('turnstile-shell');
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const i18n = await window.travelAgentAuthI18n.init('reset_password');
  let turnstileConfig = null;
  let turnstileWidgetId = null;
  let turnstileToken = '';

  function page(key, fallback) {
    return i18n.page(key, fallback);
  }

  function shared(key, fallback) {
    return i18n.shared(key, fallback);
  }

  document.title = page('meta_title', 'Reset Password - TravelAgent');
  document.getElementById('subtitle').textContent = page('subtitle', 'Request a password reset link or set a new password.');
  document.getElementById('request-email-label').textContent = shared('email_label', 'Email');
  document.getElementById('request-email').placeholder = shared('email_placeholder', 'agency@example.com');
  document.getElementById('request-btn').textContent = page('request_submit', 'Send reset link');
  document.getElementById('new-password-label').textContent = page('new_password_label', 'New password');
  document.getElementById('new-password').placeholder = page('new_password_placeholder', 'Create a new password');
  document.getElementById('confirm-password-label').textContent = page('confirm_password_label', 'Confirm new password');
  document.getElementById('confirm-password').placeholder = page('confirm_password_placeholder', 'Repeat your new password');
  document.getElementById('confirm-btn').textContent = page('confirm_submit', 'Update password');
  document.getElementById('login-link').textContent = page('back_to_login', 'Back to sign in');
  document.getElementById('turnstile-note').textContent = page('turnstile_note', 'Complete verification before requesting a reset link.');

  await initTurnstile();

  if (token) {
    requestForm.style.display = 'none';
    confirmForm.style.display = 'block';
    await validateToken();
  }

  requestForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideMessages();
    devLinkBox.style.display = 'none';

    const email = document.getElementById('request-email').value.trim();
    if (!email) {
      showError(page('request_missing_email', 'Please enter your account email.'));
      return;
    }
    if (turnstileConfig?.enabled && !turnstileToken) {
      showError(page('turnstile_required', 'Please complete the verification challenge.'));
      return;
    }

    setBusy(requestBtn, page('request_busy', 'Preparing reset link...'));

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept-Language': document.documentElement.lang || navigator.language || 'en',
        },
        body: JSON.stringify({ email, return_origin: location.origin, turnstile_token: turnstileToken }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || page('request_error', 'Could not prepare a reset link.'));
        resetTurnstile();
        resetButton(requestBtn, page('request_submit', 'Send reset link'));
        return;
      }

      showSuccess(page('request_success', 'If the account exists, a password reset link has been prepared.'));
      if (data.dev_reset_url) {
        devLinkBox.innerHTML = `${page('dev_link_hint', 'Local/dev reset link:')}<br><a class="dev-link" href="${data.dev_reset_url}">${data.dev_reset_url}</a>`;
        devLinkBox.style.display = 'block';
      }
      resetTurnstile();
      resetButton(requestBtn, page('request_submit', 'Send reset link'));
    } catch (_) {
      showError(shared('network_error', 'Connection error. Please try again.'));
      resetTurnstile();
      resetButton(requestBtn, page('request_submit', 'Send reset link'));
    }
  });

  confirmForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideMessages();

    const password = document.getElementById('new-password').value;
    const password2 = document.getElementById('confirm-password').value;
    if (!password || !password2) {
      showError(page('confirm_missing_fields', 'Please enter and confirm your new password.'));
      return;
    }
    if (password !== password2) {
      showError(page('confirm_mismatch', 'The password confirmation does not match.'));
      return;
    }

    setBusy(confirmBtn, page('confirm_busy', 'Updating password...'));

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept-Language': document.documentElement.lang || navigator.language || 'en',
        },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || page('confirm_error', 'Could not reset the password.'));
        resetButton(confirmBtn, page('confirm_submit', 'Update password'));
        return;
      }

      showSuccess(page('confirm_success', 'Your password has been updated. Redirecting to sign in...'));
      setTimeout(() => location.replace(data.redirect_url || '/login.html?reset=1'), 500);
    } catch (_) {
      showError(shared('network_error', 'Connection error. Please try again.'));
      resetButton(confirmBtn, page('confirm_submit', 'Update password'));
    }
  });

  async function validateToken() {
    hideMessages();
    try {
      const res = await fetch(`/api/auth/reset-password/${encodeURIComponent(token)}`, {
        headers: { 'Accept-Language': document.documentElement.lang || navigator.language || 'en' },
      });
      const data = await res.json();
      if (!res.ok) {
        confirmForm.style.display = 'none';
        showError(data.error || page('token_invalid', 'Reset link is invalid or expired.'));
        return;
      }

      tokenHint.textContent = page('token_valid_hint', 'Resetting password for {{email_hint}}.').replace('{{email_hint}}', data.email_hint || '***');
      tokenHint.style.display = 'block';
    } catch (_) {
      confirmForm.style.display = 'none';
      showError(shared('network_error', 'Connection error. Please try again.'));
    }
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = 'block';
  }

  function showTurnstileError(reason) {
    const base = page('turnstile_error', 'Verification could not be loaded. Please refresh and try again.');
    const detail = reason ? ` [${reason}]` : '';
    showError(`${base}${detail}`);
  }

  function showSuccess(message) {
    successEl.textContent = message;
    successEl.style.display = 'block';
  }

  function hideMessages() {
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
  }

  function setBusy(button, label) {
    button.disabled = true;
    button.innerHTML = `<span class="spinner"></span>${label}`;
  }

  function resetButton(button, label) {
    button.disabled = false;
    button.textContent = label;
  }

  function resetTurnstile() {
    turnstileToken = '';
    if (turnstileWidgetId != null && window.turnstile?.reset) {
      window.turnstile.reset(turnstileWidgetId);
    }
  }

  async function initTurnstile() {
    try {
      const response = await fetch('/api/auth/turnstile-config', {
        headers: { 'Accept-Language': document.documentElement.lang || navigator.language || 'en' },
      });
      const data = await response.json();
      turnstileConfig = data?.forgot_password || null;
      if (!turnstileConfig?.enabled || !turnstileConfig?.site_key) {
        return;
      }

      turnstileShell.style.display = 'block';
      await loadTurnstileScript();
      if (!window.turnstile?.render) {
        throw new Error('Turnstile API unavailable');
      }

      turnstileWidgetId = window.turnstile.render('#turnstile-container', {
        sitekey: turnstileConfig.site_key,
        action: turnstileConfig.action || 'forgot_password',
        theme: 'light',
        callback(tokenValue) {
          turnstileToken = tokenValue || '';
        },
        'expired-callback'() {
          turnstileToken = '';
        },
        'error-callback'(code) {
          turnstileToken = '';
          showTurnstileError(code || 'turnstile_error_callback');
        },
      });
    } catch (error) {
      turnstileShell.style.display = 'block';
      showTurnstileError(error?.message || 'turnstile_init_failed');
    }
  }

  async function loadTurnstileScript() {
    if (window.turnstile?.render) return;
    if (window.__turnstileLoader) {
      await window.__turnstileLoader;
      return;
    }

    window.__turnstileLoader = new Promise((resolve, reject) => {
      const timeoutId = setTimeout(() => reject(new Error('turnstile_load_timeout')), 8000);
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      script.async = true;
      script.defer = true;
      script.onload = () => {
        clearTimeout(timeoutId);
        resolve();
      };
      script.onerror = () => {
        clearTimeout(timeoutId);
        reject(new Error('turnstile_load_failed'));
      };
      document.head.appendChild(script);
    });

    await window.__turnstileLoader;
  }
})();
</script>
</body>
</html>
