<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="suppliers.meta.title">Supplier Library — Agent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F1F5F9; color: #1a1a2e; min-height: 100vh; }

    /* -- Topbar -- */
    .topbar {
      background: #1e1e2e; color: #cdd6f4; padding: 0 20px;
      display: flex; align-items: center; gap: 16px; height: 52px;
      border-bottom: 2px solid #313244;
    }
    .topbar h1 { font-size: 15px; font-weight: 700; color: #cba6f7; flex-shrink: 0; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .topbar-right a { color: #6e738d; font-size: 12px; text-decoration: none; }
    .topbar-right a:hover { color: #cdd6f4; }
    #connect-status { font-size: 12px; color: #a6e3a1; }

    /* -- App layout -- */
    .app-layout { display: flex; min-height: calc(100vh - 52px); }

    /* -- Sidebar -- */
    .sidebar {
      width: 200px; flex-shrink: 0;
      background: #fff; border-right: 1px solid #e2e8f0;
      padding: 12px 0; position: sticky; top: 0;
      height: calc(100vh - 52px); overflow-y: auto; z-index: 9;
    }
    .sidebar-group { margin-bottom: 4px; }
    .sidebar-group-label {
      padding: 10px 16px 3px;
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #94a3b8;
    }
    .sidebar-item {
      display: block; width: 100%; text-align: left;
      background: none; border: none; border-left: 3px solid transparent;
      padding: 8px 16px 8px 19px;
      font-size: 13px; font-weight: 500; color: #475569;
      cursor: pointer; text-decoration: none; font-family: inherit;
      line-height: 1.4; transition: background .1s, color .1s;
    }
    .sidebar-item:hover { background: #f1f5f9; color: #1e293b; }
    .sidebar-item.active { color: #6366F1; border-left-color: #6366F1; background: #eef2ff; font-weight: 600; }
    .sidebar-divider { border: none; border-top: 1px solid #e2e8f0; margin: 6px 0; }

    /* -- Main content -- */
    .main-content { flex: 1; padding: 28px 32px; min-width: 0; }

    /* -- Cards -- */
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-header h2 { font-size: 14px; font-weight: 700; color: #1e293b; }
    .card-body { padding: 20px; }
    .empty-state { text-align: center; padding: 32px; color: #94a3b8; font-size: 14px; }

    /* -- Buttons -- */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-family: inherit; }
    .btn-primary { background: #6366F1; color: #fff; border-color: #6366F1; }
    .btn-primary:hover { background: #4F46E5; }
    .btn-ghost { background: transparent; color: #475569; border-color: #d1d5db; }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* -- Toast -- */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); opacity: 0; transition: all .3s; background: #1e293b; color: #f1f5f9; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 999; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.err { background: #dc2626; }
  </style>
  <!-- MS Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "weog9ymwey");
  </script>
</head>
<body>

<header class="topbar">
  <h1>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
    <span data-i18n="suppliers.page_title">Supplier Library</span>
  </h1>
  <div class="topbar-right">
    <span id="connect-status"></span>
    <a href="tour-config.html" data-i18n="tour_config.tabs.tour_builder">Tour Builder</a>
    <a href="dashboard.html" data-i18n="tour_config.header.dashboard">Dashboard</a>
  </div>
</header>

<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-group">
      <div class="sidebar-group-label" data-i18n="tour_config.tabs.tour_builder">Tour Builder</div>
      <a class="sidebar-item" href="tour-config.html#tours"   data-i18n="tour_config.tabs.tours">Tours</a>
      <a class="sidebar-item" href="tour-config.html#stops"   data-i18n="tour_config.tabs.stops">Stops</a>
      <a class="sidebar-item" href="tour-config.html#pricing" data-i18n="tour_config.tabs.pricing">Price Config</a>
      <a class="sidebar-item" href="tour-config.html#tagging" data-i18n="tour_config.tabs.tagging">Tagging</a>
      <a class="sidebar-item" href="tour-config.html#content" data-i18n="tour_config.tabs.content">Content</a>
      <a class="sidebar-item" href="tour-config.html#preview" data-i18n="tour_config.tabs.preview">Preview</a>
      <a class="sidebar-item" href="tour-config.html#publish" data-i18n="tour_config.tabs.publish">Publish</a>
    </div>
    <hr class="sidebar-divider" />
    <div class="sidebar-group">
      <div class="sidebar-group-label" data-i18n="tour_config.tabs.business">Business</div>
      <a class="sidebar-item active" href="suppliers.html" data-i18n="tour_config.tabs.suppliers">Suppliers</a>
      <a class="sidebar-item" href="team.html"             data-i18n="tour_config.tabs.team">Team</a>
    </div>
    <hr class="sidebar-divider" />
    <a class="sidebar-item" href="inbox.html" data-i18n="tour_config.tabs.inbox">Inbox</a>
  </nav>

  <div class="main-content">
    <div id="tier-gate-banner" style="display:none;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:14px 18px;margin-bottom:16px;font-size:13px;color:#7c2d12;align-items:center;gap:12px">
      <strong>Upgrade required</strong>
      <span id="tier-gate-message" style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" id="tier-gate-upgrade" type="button">Open billing</button>
    </div>
    <div class="card" style="max-width:900px">
      <div class="card-header">
        <h2 data-i18n="suppliers.card_title">Supplier Library</h2>
        <button class="btn btn-primary btn-sm" id="btn-new-supplier" data-i18n="suppliers.btn_new">+ New Supplier</button>
      </div>
      <div class="card-body">
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
          <input type="search" id="supplier-search" data-i18n-placeholder="suppliers.search_placeholder" placeholder="Search by name, phone, contact…" style="flex:1;min-width:180px;padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px" />
          <select id="supplier-type-filter" style="padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px">
            <option value=""          data-i18n="suppliers.filter_all_types">All types</option>
            <option value="hotel"     data-i18n="suppliers.type_hotel">🏨 Hotel</option>
            <option value="guide"     data-i18n="suppliers.type_guide">🧭 Guide</option>
            <option value="transport" data-i18n="suppliers.type_transport">🚐 Transport</option>
            <option value="restaurant" data-i18n="suppliers.type_restaurant">🍽️ Restaurant</option>
            <option value="airline"   data-i18n="suppliers.type_airline">✈️ Airline</option>
            <option value="other"     data-i18n="suppliers.type_other">📦 Other</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btn-supplier-search" data-i18n="suppliers.btn_search">Search</button>
        </div>

        <!-- Add Supplier form (initially hidden) -->
        <div id="supplier-add-form" style="display:none;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:16px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:12px" data-i18n="suppliers.form_heading">New Supplier</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_name">Name *</label><input id="saf-name" type="text" placeholder="e.g. Grand Palace Hotel" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px" /></div>
            <div><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_type">Type *</label>
              <select id="saf-type" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
                <option value="hotel"      data-i18n="suppliers.type_hotel">🏨 Hotel</option>
                <option value="guide"      data-i18n="suppliers.type_guide">🧭 Guide</option>
                <option value="transport"  data-i18n="suppliers.type_transport">🚐 Transport</option>
                <option value="restaurant" data-i18n="suppliers.type_restaurant">🍽️ Restaurant</option>
                <option value="airline"    data-i18n="suppliers.type_airline">✈️ Airline</option>
                <option value="other"      data-i18n="suppliers.type_other">📦 Other</option>
              </select></div>
            <div><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_contact_name">Contact name</label><input id="saf-contact-name" type="text" placeholder="Primary contact person" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px" /></div>
            <div><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_phone">Phone / WhatsApp</label><input id="saf-phone" type="tel" placeholder="+84 xxx" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px" /></div>
            <div><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_email">Email</label><input id="saf-email" type="email" placeholder="contact@supplier.com" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px" /></div>
            <div><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_zalo">Zalo</label><input id="saf-zalo" type="text" placeholder="Zalo ID / number" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px" /></div>
            <div style="grid-column:1/-1"><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_address">Address</label><input id="saf-address" type="text" placeholder="Street address or area" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px" /></div>
            <div style="grid-column:1/-1"><label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px" data-i18n="suppliers.field_notes">Notes</label><textarea id="saf-notes" rows="2" placeholder="Internal notes (not shown to guests)" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;resize:vertical"></textarea></div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
            <button class="btn btn-ghost btn-sm" id="btn-cancel-supplier" data-i18n="suppliers.btn_cancel">Cancel</button>
            <button class="btn btn-primary btn-sm" id="btn-submit-supplier" data-i18n="suppliers.btn_add">Add Supplier</button>
          </div>
        </div>

        <!-- Supplier list -->
        <div id="supplier-list-body"><div class="empty-state">Loading suppliers…</div></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── i18n runtime ───────────────────────────────────────────────────────────
let UI_MESSAGES = {}, UI_MESSAGES_FALLBACK = {};
function getNestedValue(dict, key) {
  return String(key).split('.').reduce((n, p) => n?.[p], dict);
}
function applyVars(tmpl, vars = {}) {
  return String(tmpl).replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] ?? `{{${k}}}`);
}
function ti(key, vars = {}) {
  return applyVars(getNestedValue(UI_MESSAGES, key) ?? getNestedValue(UI_MESSAGES_FALLBACK, key) ?? key, vars);
}
function applyStaticTranslations(root = document) {
  root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = ti(el.getAttribute('data-i18n')); });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = ti(el.getAttribute('data-i18n-placeholder')); });
  root.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = ti(el.getAttribute('data-i18n-title')); });
  const titleEl = document.querySelector('title[data-i18n]');
  if (titleEl) document.title = ti(titleEl.getAttribute('data-i18n'));
}
async function loadUiLocale() {
  const lang = localStorage.getItem('tc_ui_lang') || 'en';
  try {
    const [main, fb] = await Promise.all([
      fetch(`/api/i18n/${encodeURIComponent(lang)}`).then(r => r.json()).catch(() => ({})),
      lang !== 'en' ? fetch('/api/i18n/en').then(r => r.json()).catch(() => ({})) : Promise.resolve({}),
    ]);
    UI_MESSAGES = main?.messages || {};
    UI_MESSAGES_FALLBACK = lang === 'en' ? UI_MESSAGES : (fb?.messages || {});
    document.documentElement.lang = lang;
    applyStaticTranslations();
  } catch { /* use defaults */ }
}

const pageParams = new URLSearchParams(window.location.search);
const S = {
  tenantId: pageParams.get('tid')?.trim() || localStorage.getItem('tam_tenant_id') || localStorage.getItem('tc_tenant') || '',
  baseUrl: window.location.origin,
  tierKey: '',
};

function tourSurfaceAllowed() {
  return S.tierKey === 'tour_operator_pro' || S.tierKey === 'tour_hotel_suite';
}

function getUpgradeTargetsForTier() {
  if (S.tierKey === 'starter_landing') return ['tour_operator_pro', 'hotel_operator_pro', 'tour_hotel_suite'];
  if (S.tierKey === 'hotel_operator_pro' || S.tierKey === 'tour_operator_pro') return ['tour_hotel_suite'];
  return [];
}

function tierLabel(tierKey) {
  if (tierKey === 'tour_operator_pro') return 'Tours Pro';
  if (tierKey === 'hotel_operator_pro') return 'Hotel Pro';
  if (tierKey === 'tour_hotel_suite') return 'Tour + Hotel Suite';
  return 'Landing Only';
}

function goToBilling(message, targetKey = '') {
  const url = new URL('/dashboard.html', window.location.origin);
  if (S.tenantId) url.searchParams.set('tid', S.tenantId);
  url.searchParams.set('pane', 'billing');
  url.searchParams.set('upgrade', '1');
  if (message) url.searchParams.set('billing_notice', message);
  if (targetKey) url.searchParams.set('membership_target', targetKey);
  window.location.href = `${url.pathname}${url.search}${url.hash}`;
}

function ensureTourSurfaceAccess(message) {
  if (tourSurfaceAllowed()) return true;
  goToBilling(message || 'This supplier workflow unlocks with Tours Pro or the Tour + Hotel Suite.');
  return false;
}

async function resolveTenantTier() {
  const res = await fetch('/api/tenants/settings', { headers: { 'X-Tenant-ID': S.tenantId }, credentials: 'same-origin' });
  const payload = await res.json().catch(() => null);
  if (res.ok && payload?.settings) {
    S.tierKey = String(payload.settings.product_tier_key || 'starter_landing').trim() || 'starter_landing';
  }
}

function applyTierGateBanner() {
  const banner = document.getElementById('tier-gate-banner');
  const msg = document.getElementById('tier-gate-message');
  const upgradeBtn = document.getElementById('tier-gate-upgrade');
  if (!banner || !msg) return;
  if (tourSurfaceAllowed()) {
    banner.style.display = 'none';
    return;
  }
  msg.textContent = S.tierKey === 'hotel_operator_pro'
    ? 'Suppliers is part of the tour-business workflow. Upgrade to the Tour + Hotel Suite to use it.'
    : 'Landing Only can preview this library, but creating or managing suppliers requires Tours Pro or the Tour + Hotel Suite.';
  document.getElementById('tier-gate-actions')?.remove();
  if (upgradeBtn) {
    upgradeBtn.style.display = '';
    upgradeBtn.textContent = 'Upgrade';
    upgradeBtn.onclick = () => goToBilling('Upgrade your membership to use the supplier library.', S.tierKey === 'hotel_operator_pro' ? 'tour_hotel_suite' : '');
  }
  banner.style.display = 'flex';
}

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 4000);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const h = () => ({ 'Content-Type': 'application/json', 'X-Tenant-ID': S.tenantId });

async function api(path, opts = {}) {
  opts.headers = Object.assign(h(), opts.headers ?? {});
  const res = await fetch(S.baseUrl + path, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    const ret = encodeURIComponent(window.location.pathname + window.location.search);
    window.location.replace('/login.html?redirect=' + ret);
    throw new Error('Session expired');
  }
  if (!res.ok) throw new Error(data.error ?? `HTTP ${res.status}`);
  return data;
}

async function resolveTenantContext() {
  const payload = await fetch('/api/auth/session', { credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  if (!payload?.authenticated || !payload?.session?.tenant_id) {
    const ret = encodeURIComponent(window.location.pathname + window.location.search);
    window.location.replace('/login.html?redirect=' + ret);
    return '';
  }
  S.tenantId = payload.session.tenant_id;
  localStorage.setItem('tam_tenant_id', S.tenantId);
  localStorage.setItem('tc_tenant', S.tenantId);
  return S.tenantId;
}

// ── Supplier icon map ──────────────────────────────────────────────────────
const TYPE_ICONS = { hotel:'🏨', guide:'🧭', transport:'🚐', restaurant:'🍽️', airline:'✈️', other:'📦' };

async function loadSuppliers() {
  const body = document.getElementById('supplier-list-body');
  if (!body) return;
  const q    = document.getElementById('supplier-search')?.value?.trim() || '';
  const type = document.getElementById('supplier-type-filter')?.value || '';
  try {
    let url = '/api/suppliers?';
    if (q)    url += `q=${encodeURIComponent(q)}&`;
    if (type) url += `type=${encodeURIComponent(type)}&`;
    const data = await api(url);
    renderSupplierList(data.suppliers || []);
  } catch (e) {
    body.innerHTML = `<div class="empty-state" style="color:#ef4444">${esc(e.message)}</div>`;
  }
}

function renderSupplierList(list) {
  const body = document.getElementById('supplier-list-body');
  if (!list.length) { body.innerHTML = `<div class="empty-state">${esc(ti('suppliers.empty'))}</div>`; return; }
  body.innerHTML = list.map(s => `
    <div style="display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;background:#fff">
      <div style="font-size:24px;line-height:1;flex-shrink:0">${TYPE_ICONS[s.type] || '📦'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;color:#0f172a">${esc(s.name)}</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">${esc(s.type || '')}</div>
        ${s.contact_name  ? `<div style="font-size:12px;color:#475569;margin-top:4px">👤 ${esc(s.contact_name)}</div>` : ''}
        ${s.contact_phone ? `<div style="font-size:12px;color:#475569">📞 ${esc(s.contact_phone)}</div>` : ''}
        ${s.contact_email ? `<div style="font-size:12px;color:#475569">✉️ ${esc(s.contact_email)}</div>` : ''}
        ${s.address       ? `<div style="font-size:12px;color:#475569">📍 ${esc(s.address)}</div>` : ''}
        ${s.notes         ? `<div style="font-size:11px;color:#94a3b8;margin-top:4px;font-style:italic">${esc(s.notes)}</div>` : ''}
      </div>
      <button onclick="deleteSupplier('${esc(s.id)}')" class="btn btn-ghost btn-sm" style="color:#ef4444;border-color:#fca5a5;flex-shrink:0" title="Delete">✕</button>
    </div>`).join('');
}

async function deleteSupplier(id) {
  if (!confirm(ti('suppliers.confirm_delete'))) return;
  try {
    await api(`/api/suppliers/${id}`, { method: 'DELETE' });
    toast(ti('suppliers.toast_deleted'));
    loadSuppliers();
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  }
}

// ── Event bindings ─────────────────────────────────────────────────────────
document.getElementById('btn-new-supplier').addEventListener('click', () => {
  if (!ensureTourSurfaceAccess('Upgrade your membership to create and manage suppliers.')) return;
  const form = document.getElementById('supplier-add-form');
  form.style.display = form.style.display === 'none' ? '' : 'none';
});
document.getElementById('btn-cancel-supplier').addEventListener('click', () => {
  document.getElementById('supplier-add-form').style.display = 'none';
});
document.getElementById('btn-submit-supplier').addEventListener('click', async () => {
  if (!ensureTourSurfaceAccess('Upgrade your membership to create and manage suppliers.')) return;
  const name = document.getElementById('saf-name')?.value?.trim();
  const type = document.getElementById('saf-type')?.value;
  if (!name) { toast(ti('suppliers.error_name_required'), 'err'); return; }
  const btn = document.getElementById('btn-submit-supplier');
  btn.disabled = true; btn.textContent = ti('suppliers.saving');
  try {
    await api('/api/suppliers', {
      method: 'POST',
      body: JSON.stringify({
        name, type,
        contact_name:  document.getElementById('saf-contact-name')?.value?.trim() || null,
        contact_phone: document.getElementById('saf-phone')?.value?.trim() || null,
        contact_email: document.getElementById('saf-email')?.value?.trim() || null,
        contact_zalo:  document.getElementById('saf-zalo')?.value?.trim() || null,
        address:       document.getElementById('saf-address')?.value?.trim() || null,
        notes:         document.getElementById('saf-notes')?.value?.trim() || null,
      }),
    });
    toast(ti('suppliers.toast_added'));
    document.getElementById('supplier-add-form').style.display = 'none';
    document.getElementById('saf-name').value = '';
    loadSuppliers();
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = ti('suppliers.btn_add');
  }
});
document.getElementById('btn-supplier-search').addEventListener('click', loadSuppliers);
document.getElementById('supplier-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadSuppliers(); });
document.getElementById('supplier-type-filter').addEventListener('change', loadSuppliers);
document.getElementById('tier-gate-upgrade')?.addEventListener('click', () => goToBilling('Upgrade your membership to use the supplier library.'));

// ── Boot ───────────────────────────────────────────────────────────────────
(async () => {
  await loadUiLocale();
  const tenantId = await resolveTenantContext();
  if (!tenantId) return;
  await resolveTenantTier();
  applyTierGateBanner();
  if (!tourSurfaceAllowed()) return;
  await loadSuppliers();
})();
</script>
</body>
</html>
