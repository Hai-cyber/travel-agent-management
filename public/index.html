<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelAgent — Loading…</title>
  <script>
    (async function() {
      try {
        var response = await fetch('/api/auth/session');
        var data = await response.json();
        if (data && data.authenticated && data.session && data.session.tenant_id) {
          localStorage.setItem('tam_tenant_id', data.session.tenant_id);
          location.replace('/dashboard.html');
          return;
        }
      } catch (_) {}
      location.replace('/signup.html');
    })();
  </script>
</head>
<body>
  <p>Loading… <a href="/signup.html">Open signup</a></p>
</body>
</html>
