<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TravelAgent — Loading…</title>
  <script>
    // Smart redirect: only go to dashboard if a tenant session exists.
    // If NOT, stay on this page (signup landing) — avoids redirect loops.
    (function() {
      var tenantId = new URLSearchParams(location.search).get('tenant')
                   || localStorage.getItem('tam_tenant_id');
      if (tenantId) {
        // Tenant known — go directly to dashboard
        location.replace('/dashboard.html');
      }
      // No tenant — fall through to render signup page below
    })();
  </script>
</head>
<body>
  <p>Loading Dashboard… <a href="/dashboard.html">Click here if not redirected.</a></p>
</body>
</html>
