<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - TravelAgent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1d4ed8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page-shell { width: 100%; max-width: 520px; }
    .card {
      background: rgba(255,255,255,.98);
      border-radius: 18px;
      padding: 40px;
      width: 100%;
      box-shadow: 0 30px 70px rgba(15,23,42,.32);
    }
    .logo { font-size: 28px; font-weight: 800; color: #2563eb; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; margin-top: 16px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #dbe4f0;
      border-radius: 10px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #2563eb; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover:not(:disabled) { background: #1d4ed8; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-secondary {
      background: #fff;
      color: #0f172a;
      border: 1.5px solid #dbe4f0;
      margin-top: 14px;
    }
    .btn-secondary:hover:not(:disabled) { background: #f8fafc; }
    .divider {
      position: relative;
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
    }
    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px solid #e2e8f0;
    }
    .divider span {
      position: relative;
      background: #fff;
      padding: 0 10px;
    }
    .google-slot { margin-top: 14px; display: flex; justify-content: center; min-height: 42px; }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; text-align: center; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 14px; display: none; }
    .success-msg { color: #16a34a; font-size: 13px; margin-top: 14px; display: none; }
    .signup-link { text-align: center; margin-top: 22px; font-size: 13px; color: #64748b; }
    .signup-link a { color: #2563eb; text-decoration: none; font-weight: 700; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: -3px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="page-shell">
  <div class="card">
    <div class="logo">🧭 TravelAgent</div>
    <div class="subtitle" id="subtitle">Sign in to your tour operations dashboard.</div>

    <form id="login-form" novalidate>
      <label id="label-email" for="f-email">Email</label>
      <input id="f-email" type="email" placeholder="agency@example.com" required autocomplete="email" />

      <label id="label-password" for="f-password">Password</label>
      <input id="f-password" type="password" placeholder="Enter your password" required autocomplete="current-password" />

      <button class="btn" id="submit-btn" type="submit">Sign in</button>

      <div class="divider"><span id="divider-or">or</span></div>
      <div class="google-slot" id="google-slot"></div>
      <button class="btn btn-secondary" id="google-fallback-btn" type="button" style="display:none">Continue with Google</button>
      <div class="hint" id="google-hint">Google sign-in will appear when GOOGLE_CLIENT_ID is configured.</div>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg">Signed in successfully. Redirecting...</div>
    </form>

    <div class="signup-link"><span id="signup-prompt">Don't have an account?</span> <a id="signup-link" href="/signup.html">Create account -></a></div>
  </div>
</div>

<script src="/auth-page-i18n.js"></script>
<script>
(async () => {
  const sessionRes = await fetch('/api/auth/session').then((res) => res.json()).catch(() => null);
  if (sessionRes?.authenticated && sessionRes?.session?.tenant_id) {
    localStorage.setItem('tam_tenant_id', sessionRes.session.tenant_id);
    location.replace('/dashboard.html');
    return;
  }

  const form = document.getElementById('login-form');
  const errEl = document.getElementById('error-msg');
  const okEl = document.getElementById('success-msg');
  const btn = document.getElementById('submit-btn');
  const googleSlot = document.getElementById('google-slot');
  const googleHint = document.getElementById('google-hint');
  const googleFallbackBtn = document.getElementById('google-fallback-btn');
  const i18n = await window.travelAgentAuthI18n.init('login');

  function page(key, fallback) {
    return i18n.page(key, fallback);
  }

  function shared(key, fallback) {
    return i18n.shared(key, fallback);
  }

  document.title = page('meta_title', 'Sign In - TravelAgent');
  document.getElementById('subtitle').textContent = page('subtitle', 'Sign in to your tour operations dashboard.');
  document.getElementById('label-email').textContent = shared('email_label', 'Email');
  document.getElementById('label-password').textContent = shared('password_label', 'Password');
  document.getElementById('f-email').placeholder = shared('email_placeholder', 'agency@example.com');
  document.getElementById('f-password').placeholder = page('password_placeholder', 'Enter your password');
  document.getElementById('submit-btn').textContent = page('submit', 'Sign in');
  document.getElementById('divider-or').textContent = shared('or', 'or');
  document.getElementById('google-fallback-btn').textContent = shared('google_continue', 'Continue with Google');
  document.getElementById('google-hint').textContent = shared('google_hint_disabled', 'Google sign-in will appear when GOOGLE_CLIENT_ID is configured.');
  document.getElementById('success-msg').textContent = page('success', 'Signed in successfully. Redirecting...');
  document.getElementById('signup-prompt').textContent = page('signup_prompt', 'Don\'t have an account?');
  document.getElementById('signup-link').textContent = page('signup_link', 'Create account ->');

  const googleConfig = await fetch('/api/auth/google/config').then((res) => res.json()).catch(() => ({ enabled: false }));
  if (googleConfig?.enabled && googleConfig?.client_id) {
    googleHint.textContent = shared('google_hint_login_enabled', 'You can sign in with email or Google.');
    await loadGoogleClient(googleConfig.client_id);
  } else {
    googleFallbackBtn.disabled = true;
    googleFallbackBtn.style.display = 'block';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errEl.style.display = 'none';

    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-password').value;
    if (!email || !password) {
      showError(page('missing_fields', 'Please enter your email and password.'));
      return;
    }

    setBusy(page('busy', 'Signing in...'));

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept-Language': document.documentElement.lang || navigator.language || 'en',
        },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || page('default_error', 'Sign-in failed.'));
        resetBtn();
        return;
      }

      localStorage.setItem('tam_tenant_id', data.tenant_id);
      okEl.style.display = 'block';
      setTimeout(() => location.replace(data.redirect_url || '/dashboard.html'), 350);
    } catch (_) {
      showError(shared('network_error', 'Connection error. Please try again.'));
      resetBtn();
    }
  });

  async function loadGoogleClient(clientId) {
    await new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-google-identity="true"]');
      if (existing) {
        if (window.google?.accounts?.id) {
          resolve();
          return;
        }
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', reject, { once: true });
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.dataset.googleIdentity = 'true';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });

    if (!window.google?.accounts?.id) {
      googleHint.textContent = shared('google_load_failed', 'Google Sign-In could not be loaded. Please use email and password.');
      return;
    }

    googleFallbackBtn.style.display = 'none';
    window.google.accounts.id.initialize({
      client_id: clientId,
      callback: async (response) => {
        setBusy(shared('google_continue', 'Continue with Google'));
        try {
          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept-Language': document.documentElement.lang || navigator.language || 'en',
            },
            body: JSON.stringify({ id_token: response.credential }),
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.error || page('google_error', 'Google sign-in failed.'));
            resetBtn();
            return;
          }
          localStorage.setItem('tam_tenant_id', data.tenant_id);
          okEl.style.display = 'block';
          setTimeout(() => location.replace(data.redirect_url || '/dashboard.html'), 350);
        } catch (_) {
          showError(shared('network_error', 'Connection error. Please try again.'));
          resetBtn();
        }
      },
    });

    window.google.accounts.id.renderButton(googleSlot, {
      theme: 'outline',
      size: 'large',
      width: 320,
      text: 'continue_with',
      shape: 'pill',
    });
  }

  function showError(message) {
    errEl.textContent = message;
    errEl.style.display = 'block';
  }

  function setBusy(label) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>${label}`;
  }

  function resetBtn() {
    btn.disabled = false;
    btn.textContent = page('submit', 'Sign in');
  }
})();
</script>
</body>
</html>
