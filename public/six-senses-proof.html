<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Six Senses Soul Preview</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #081017;
      font-family: Inter, system-ui, sans-serif;
    }
    .frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #081017;
    }
    .hud {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 20;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(8,16,23,0.56);
      color: #f8fafc;
      text-decoration: none;
      font: 700 11px/1 Inter, system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .chip.note {
      color: rgba(248,250,252,0.78);
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: none;
    }
    @media (max-width: 720px) {
      .hud {
        left: 14px;
        right: 14px;
        top: auto;
        bottom: 14px;
      }
    }
  </style>
  <!-- MS Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "weog9ymwey");
  </script>
</head>
<body>
  <div class="hud">
    <span class="chip">Six Senses Soul</span>
    <span class="chip note">Invisible header, centered logo, right menu, immersive hero, live tenant seed data</span>
  </div>
  <iframe class="frame" src="/api/tenant/preview?tid=ten-demo-001" title="Six Senses storefront preview"></iframe>
</body>
</html>
